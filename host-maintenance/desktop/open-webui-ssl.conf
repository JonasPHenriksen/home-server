# Open WebUI over HTTPS with the home certificate. The container is published on 127.0.0.1:3000 only.
# Listen is here instead of ports.conf, so disabling this site closes the port as well.
Listen 3443

<VirtualHost *:3443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/home-desktop.crt
    SSLCertificateKeyFile /etc/apache2/ssl/home-desktop.key

    ProxyPreserveHost On
    # Apache's default is Timeout (300 s without data from Open WebUI); slow model calls must not be cut off
    ProxyTimeout 3600
    # upgrade=websocket carries Socket.IO, which is how Open WebUI streams chat answers
    ProxyPass / http://127.0.0.1:3000/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto https

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
