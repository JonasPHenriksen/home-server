# Local: DietPi ships /run/dietpi as 0777 (tmpfiles.d/dietpi.conf), and its login
# banner reads and runs files from it, including for root. That is world-writable,
# so any account could plant a file. This overrides the mode to 0755 on every
# boot. A separate file because dietpi-update overwrites tmpfiles.d/dietpi.conf.
z /run/dietpi 0755 root root -
